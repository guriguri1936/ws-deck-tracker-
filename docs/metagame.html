<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メタゲーム(すべてのデッキ) - ヴァイスシュバルツ 大会結果 集計</title>
<link rel="stylesheet" href="css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-52BQKMPX6C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-52BQKMPX6C');
</script>
</head>
<body>
<header>
  <div class="header-inner">
    <p><a href="index.html" class="back-link">← メタゲームに戻る</a></p>
  </div>
</header>

<div class="error-banner" id="loadError"></div>

<main>
  <div class="filters">
    <label>
      主催区分
      <select id="filterOrganizerType">
        <option value="">すべて</option>
        <option value="official">公式主催</option>
        <option value="individual">個人主催</option>
      </select>
    </label>
    <label>
      大会形式
      <select id="filterTournamentFormat">
        <option value="">すべて</option>
        <option value="single">シングル</option>
        <option value="trio">トリオ</option>
      </select>
    </label>
    <label>
      期間
      <select id="filterPeriod">
        <option value="30">直近30日</option>
        <option value="60" selected>直近60日</option>
        <option value="90">直近90日</option>
        <option value="365">直近365日</option>
      </select>
    </label>
    <span id="resultCount"></span>
  </div>

  <section class="panel">
    <h2>メタゲーム(すべてのデッキ)</h2>
    <p class="subtitle">タイルをクリックすると、そのデッキの詳細ページが新しいタブで開きます。</p>
    <div class="deck-list-controls">
      <label>
        タイトル
        <select id="deckTitleFilter">
          <option value="">すべて</option>
        </select>
      </label>
      <label>
        検索
        <input type="text" id="deckSearch" placeholder="デッキ名で検索">
      </label>
      <label>
        並び替え
        <select id="deckSort">
          <option value="count">使用件数順</option>
          <option value="championshipRate">優勝率順</option>
          <option value="label">名前順</option>
        </select>
      </label>
    </div>
    <div class="tile-grid" id="tileGrid"></div>
    <div class="empty-state" id="tileEmptyState">対象データなし</div>
  </section>
</main>


<script src="js/common.js"></script>
<script src="js/metagame.js"></script>
</body>
</html>
