<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デッキ詳細 - ヴァイスシュバルツ 大会結果 集計</title>
<link rel="stylesheet" href="css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-52BQKMPX6C"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<body>
<header>
  <div class="header-inner">
    <p><a href="index.html" class="back-link">← メタゲームに戻る</a></p>
  </div>
</header>

<div class="error-banner" id="loadError"></div>

<main>
  <div class="empty-state" id="deckNotFound" style="display:none">対象データが見つかりませんでした。</div>

  <div class="layout">
    <div class="main-col">
      <section class="panel" id="deckHeaderSection"></section>

      <section class="panel">
        <h2 id="decklistHeading">最新の入賞デッキリスト</h2>
        <div id="latestDecklistSection"></div>
      </section>

      <section class="panel" id="cardAdoptionSection"></section>
    </div>

    <aside class="side-col">
      <section class="panel">
        <h2>このデッキの記録</h2>
        <div id="deckRecentList"></div>
        <div class="empty-state" id="deckRecentEmpty">対象データなし</div>
      </section>
    </aside>
  </div>
</main>


<script src="js/common.js"></script>
<script src="js/deck.js"></script>
</body>
</html>
